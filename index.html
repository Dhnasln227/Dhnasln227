<head>
    <meta charset="UTF-8">

    <title>Duhan Aslan Şafak - HUD Full Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --neon: #00ff41; 
            --danger: #ff3e3e; 
            --info: #00d4ff; 
            --warning: #f1c40f;
            --bg: #050505; 
            --panel-bg: rgba(10, 10, 10, 0.95);
        }

        /* --- GELİŞMİŞ LOADER & BOOT SCREEN --- */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: var(--neon);
            padding: 20px;
        }

        .terminal-box {
            width: 90%;
            max-width: 600px;
            background: rgba(0, 40, 0, 0.1);
            padding: 20px;
            border: 1px solid rgba(0, 255, 65, 0.2);
            position: relative;
        }

        #boot-logs {
            font-size: 11px;
            height: 180px;
            overflow: hidden;
            margin-bottom: 20px;
            line-height: 1.4;
            color: var(--neon);
            text-shadow: 0 0 5px var(--neon);
        }

        .loader-container {
            width: 100%;
            height: 15px;
            background: #001a00;
            border: 1px solid var(--neon);
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        #loader-fill {
            height: 100%;
            width: 0%;
            background: var(--neon);
            box-shadow: 0 0 15px var(--neon);
            transition: width 0.1s linear;
        }

        .loader-stats {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 20px;
        }

        .identity-card {
            border: 2px solid var(--neon);
            padding: 15px;
            background: rgba(0, 255, 65, 0.05);
            display: none;
            text-align: center;
            animation: glitch 0.3s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            100% { transform: skew(1deg); }
        }

        /* --- ANA UI (Önceki Tasarımın Devamı) --- */
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh;
            text-transform: uppercase;
            overflow: hidden;
        }

        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(0, 255, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            background-size: 100% 4px, 3px 100%;
            z-index: 2000;
            pointer-events: none;
        }

        .map-panel { width: 100%; height: 35vh; position: relative; border-bottom: 2px solid var(--neon); flex-shrink: 0;}
        #map { width: 100%; height: 100%; background: #000; }
        .radar-hattı {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent, rgba(0, 255, 65, 0.1), transparent);
            background-size: 100% 100px;
            animation: radarTara 4s linear infinite;
            z-index: 999; pointer-events: none;
        }
        @keyframes radarTara { 0% { background-position: 0 -100px; } 100% { background-position: 0 35vh; } }

        .bilgi-ekrani { 
            position: absolute; bottom: 5px; left: 5px; right: 5px; 
            background: rgba(0, 0, 0, 0.9); padding: 8px; z-index: 1000;
            border-left: 3px solid var(--neon);
        }

        #il-adi { margin: 0; font-size: 16px; color: var(--neon); }
        #city-desc { font-size: 9px; color: #aaa; text-transform: none; }

        .data-container {
            padding: 12px; display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto; flex-grow: 1;
        }

        .bar-section { background: var(--panel-bg); padding: 8px; border: 1px solid #1a1a1a; }
        .bar-label { display: flex; justify-content: space-between; font-size: 9px; margin-bottom: 4px; color: var(--neon); }
        .bar-bg { height: 6px; background: #000; border: 1px solid #333; margin-bottom: 6px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 1s ease-in-out; }

        .safak-display { text-align: center; padding: 10px; background: rgba(0, 255, 65, 0.05); border: 1px solid #1a1a1a; }
        .big-safak { font-size: 60px; font-weight: 900; color: var(--neon); margin: 0; line-height: 1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .card { background: #0a0a0a; padding: 10px; border: 1px solid #1a1a1a; }
        .card label { display: block; font-size: 7px; color: #666; margin-bottom: 2px; }
        .card span { font-size: 14px; font-weight: bold; color: #eee; }

    </style>
</head>

        const sehirIsimleri = ["", "Adana", "Adıyaman", "Afyon", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir", "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli", "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari", "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir", "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "K.Maraş", "Mardin", "Muğla", "Muş", "Nevşehir", "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat", "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman", "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"];
        let map;
        const birimler = [{l:"GÜN",id:"gun",d:86400000},{l:"HAFTA",id:"hafta",d:604800000},{l:"SAAT",id:"saat",d:3600000},{l:"DAKİKA",id:"dakika",d:60000}];

        document.addEventListener('DOMContentLoaded', function() {
            runMilitaryBoot();
        });

        async function runMilitaryBoot() {
            const logs = document.getElementById('boot-logs');
            const fill = document.getElementById('loader-fill');
            const percent = document.getElementById('loader-percent');
            const status = document.getElementById('loader-status');
            
            const messages = [
                {t: "> SYSTEM BOOT V2.0.4...", p: 5},
                {t: "> KERNEL: MIL_OS_SECURE_LAYER", p: 10},
                {t: "> ANALYZING HARDWARE: OK", p: 15},
                {t: "> CONNECTING TO MANISA TMM ARCHIVE...", p: 25},
                {t: "> ACCESSING KOMANDO TUGAYI TRAINING DATA...", p: 35},
                {t: "> [OK] INFANTRY SKILLS VERIFIED", p: 40},
                {t: "> [OK] COMMANDO PROTOCOL REGISTERED", p: 50},
                {t: "> REDIRECTING TO CURRENT UNIT: IZMIR/GAZIEMIR", p: 65},
                {t: "> ATTACHING: YENIKALE SOSYAL TESISLERI", p: 75},
                {t: "> DUTY: ULAŞTIRMA ER / GAZINO MUDURLUGU", p: 85},
                {t: "> ACTIVATING HUD DISPLAY...", p: 95},
                {t: "> SYSTEM READY.", p: 100}
            ];

            for (let msg of messages) {
                const p = document.createElement('div');
                p.innerText = msg.t;
                logs.appendChild(p);
                logs.scrollTop = logs.scrollHeight;
                
                // Progress bar güncelleme
                fill.style.width = msg.p + "%";
                percent.innerText = msg.p + "%";
                
                if(msg.p === 100) status.innerText = "READY";
                
                // Rastgele gecikme ile "yükleniyor" hissi ver
                await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
            }

            // Kimlik Kartı Gösterimi
            document.getElementById('identity-card').style.display = 'block';
            await new Promise(r => setTimeout(r, 3000)); // Kart 3 saniye ekranda kalsın

            // Kapanış ve Ana Ekran
            document.getElementById('boot-screen').style.transition = 'opacity 1s';
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                initMainHUD();
            }, 1000);
        }

        function initMainHUD() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([39.0, 35.0], 5);
            L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);

            const grid = document.getElementById('time-grid');
            birimler.forEach(u => {
                grid.innerHTML += `<div class="card"><label>KALAN_${u.l}</label><span id="k-${u.id}">0</span></div>
                                   <div class="card"><label>GEÇEN_${u.l}</label><span id="g-${u.id}">0</span></div>`;
            });

            update();
            setInterval(update, 1000);
            setTimeout(() => { map.invalidateSize(); }, 500);
        }

        function update() {
            if(!map) return; 
            const baslangic = new Date("2025-12-04T00:00:00").getTime();
            const bitis = new Date("2026-06-11T00:00:00").getTime(); 
            const simdi = new Date();
            const simdiMs = simdi.getTime();
            
            let farkK = Math.max(0, bitis - simdiMs);
            let farkG = simdiMs - baslangic;
            let toplam = bitis - baslangic;
            
            let p = (farkG / toplam) * 100;
            let kG = Math.ceil(farkK / 86400000);
            
            let haftaP = 100 - ((farkK % 604800000) / 604800000 * 100);
            const ayinGunu = simdi.getDate();
            const aydakiToplamGun = new Date(simdi.getFullYear(), simdi.getMonth() + 1, 0).getDate();
            let ayP = (ayinGunu / aydakiToplamGun) * 100;

            document.getElementById("ana-safak").innerText = String(kG).padStart(2, '0');
            document.getElementById("atarsa").innerText = "YARIN: " + (kG > 1 ? String(kG - 1).padStart(2, '0') : "HÜRRİYET");
            
            document.getElementById("p-bar").style.width = p.toFixed(2) + "%";
            document.getElementById("p-percent").innerText = p.toFixed(2) + "%";
            document.getElementById("week-bar").style.width = haftaP.toFixed(2) + "%";
            document.getElementById("week-percent").innerText = haftaP.toFixed(0) + "%";
            document.getElementById("month-bar").style.width = ayP.toFixed(2) + "%";
            document.getElementById("month-percent").innerText = ayP.toFixed(0) + "%";

            birimler.forEach(u => {
                document.getElementById("k-"+u.id).innerText = Math.floor(farkK/u.d);
                document.getElementById("g-"+u.id).innerText = Math.floor(farkG/u.d);
            });

            // Şehir Takibi (81 il mantığı)
            if (kG >= 1 && kG <= 81) {
                const cityName = sehirIsimleri[kG] || "HEDEF";
                if (document.getElementById("il-adi").innerText !== "HEDEF: " + cityName.toUpperCase()) {
                    document.getElementById("il-adi").innerText = "HEDEF: " + cityName.toUpperCase();
                    document.getElementById("city-desc").innerText = "> DATA: " + (sehirVerileri[kG] || "BÖLGE TARANIYOR...");
                    const pos = koordVerileri[kG] || [39, 35];
                    map.flyTo(pos, 9, { duration: 3 });
                }
            }
        }
    </script>
