<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ağ & Sistem Uzmanlığı Günlük Rutin ve Eğitim Planı (BYINTEK P70 Modu)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        /* BYINTEK P70 PROJEKSİYON ÖZEL ULTRA OPTİMİZASYON */
        body.projection-mode {
            --bg-color: #000000 !important;
            --card-bg: #030407 !important;
            --card-border: rgba(56, 189, 248, 0.4) !important;
            --text-main: #ffffff !important;
            --text-muted: #cbd5e1 !important;
            --accent-blue: #38bdf8 !important;
            --accent-green: #4ade80 !important;
            background-image: none !important;
            font-size: 1.2rem;
        }

        body.projection-mode .clock-box h1 {
            font-size: 3.5rem !important;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
            
            /* Metin kopyalama ve seçmeyi tamamen engelleme */
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }

        *:focus {
            outline: none !important;
        }

        html, body {
            height: 100vh;
            overflow: hidden; /* Sayfanın kendisinin kaymasını tamamen kapatma */
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1300px;
            height: calc(100vh - 24px);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }

        @media (min-width: 992px) {
            .container {
                grid-template-columns: 1.8fr 1.2fr;
                grid-template-rows: 1fr;
            }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .card {
            background: #161b22;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 12px;
        }

        .card.flex-grow-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 0;
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .clock-box h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--accent-blue);
        }

        .clock-box p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .top-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* ALARM BANNERİ */
        .alarm-banner {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid var(--accent-red);
            border-radius: 14px;
            padding: 14px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            animation: alarmPulse 1s infinite alternate;
            margin-bottom: 12px;
        }

        .alarm-banner.active {
            display: flex;
        }

        @keyframes alarmPulse {
            0% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.8); }
        }

        .btn-stop-alarm {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
        }

        /* LİSTE VE BÖLÜMLER */
        .section-title {
            font-size: 1rem;
            color: var(--accent-blue);
            margin: 12px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Sadece Kart İçi Kaydırma Alanı */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            -webkit-overflow-scrolling: touch; /* Tabletlerde akıcı dokunmatik kaydırma */
        }

        .routine-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 6px;
            transition: all 0.2s;
        }

        .routine-item.active-pomo-row {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.15);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
        }

        .routine-item.completed {
            opacity: 0.45;
            background: rgba(0, 0, 0, 0.2);
        }

        .routine-item.completed .item-title {
            text-decoration: line-through;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-time {
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.12);
            padding: 4px 8px;
            border-radius: 6px;
            min-width: 80px;
            text-align: center;
        }

        .item-title {
            font-size: 0.88rem;
            font-weight: 500;
        }

        .check-btn {
            background: transparent;
            border: 2px solid var(--card-border);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .routine-item.completed .check-btn {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #000;
        }

        /* POMODORO KARTI */
        .pomodoro-card {
            text-align: center;
        }

        .pomo-timer {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 6px 0;
            letter-spacing: 2px;
            color: var(--accent-purple);
        }

        /* BUTONLAR VE İSTATİSTİK */
        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #000;
            border: none;
            font-weight: 600;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.4);
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 8px 4px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* SEKMELER (TABS) */
        .tab-header {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        .audio-test-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }
    </style>
</head>
<body id="body">

<div class="container">
    <!-- SOL KOLON: RUTİN VE EĞİTİMLER -->
    <div class="left-column">
        <div class="card header-card">
            <div class="clock-box">
                <h1 id="clock">00:00:00</h1>
                <p id="date-display">Yükleniyor...</p>
            </div>
            <div class="top-controls">
                <button class="btn" id="fullscreen-btn" title="Tam Ekran Yap">
                    <i data-lucide="maximize"></i> Tam Ekran
                </button>
                <button class="btn btn-primary" id="projection-toggle-btn" title="BYINTEK P70 Projeksiyon Modu">
                    <i data-lucide="projector"></i> P70 Modu
                </button>
            </div>
        </div>

        <!-- ALARM BANNERİ -->
        <div class="alarm-banner" id="alarm-banner">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i data-lucide="bell-ring" style="color: white; width: 28px; height: 28px;"></i>
                <div>
                    <strong style="font-size:1rem; color:white;">Süre Doldu!</strong>
                    <p style="font-size:0.8rem; color: #fecaca;">Alarm çalıyor. Alarmı kapatabilirsin.</p>
                </div>
            </div>
            <button class="btn-stop-alarm" id="btn-stop-alarm">
                <i data-lucide="volume-x"></i> Alarmı Durdur
            </button>
        </div>

        <div class="card flex-grow-card">
            <div class="tab-header">
                <button class="tab-btn active" onclick="switchTab('routine')"><i data-lucide="clock"></i> Günlük Rutin</button>
                <button class="tab-btn" onclick="switchTab('courses')"><i data-lucide="book-open"></i> Eğitim Planı (157 Ders)</button>
            </div>

            <div id="tab-routine" class="tab-content active">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h3 style="color: var(--accent-blue); font-size: 0.95rem;">Pazartesi / Pomodoro Akışı</h3>
                    <button class="btn" id="reset-routine-btn" style="padding: 3px 8px; font-size: 0.75rem;"><i data-lucide="rotate-ccw"></i> Rutini Sıfırla</button>
                </div>
                <div class="scroll-area" id="routine-container"></div>
            </div>

            <div id="tab-courses" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h3 style="color: var(--accent-blue); font-size: 0.95rem;">Tüm Modül ve Dersler</h3>
                    <button class="btn" id="reset-courses-btn" style="padding: 3px 8px; font-size: 0.75rem;"><i data-lucide="rotate-ccw"></i> Eğitimleri Sıfırla</button>
                </div>
                <div class="scroll-area" id="course-container"></div>
            </div>
        </div>
    </div>

    <!-- SAĞ KOLON: SABİT POMODORO VE İSTATİSTİKLER -->
    <div class="right-column">
        <div class="card pomodoro-card">
            <div style="display: flex; justify-content: space-between; align-items: center; text-align: left;">
                <h3 id="pomo-card-title" style="font-size: 1rem;"><i data-lucide="timer"></i> Yükleniyor...</h3>
                <span id="pomo-mode-label" style="font-size: 0.8rem; color: var(--accent-purple); font-weight:600; white-space:nowrap;">Otomatik</span>
            </div>
            <div class="pomo-timer" id="pomo-display">00:00</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);" id="pomo-info-text">Saat dilimine göre tam otomatik çalışır.</p>
        </div>

        <div class="card" style="flex: 1;">
            <h3 style="font-size: 1rem;"><i data-lucide="bar-chart-3"></i> Genel İlerleme Durumu</h3>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="stat-routine-rate">0%</div>
                    <div class="stat-label">Günlük Rutin</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-completed-count">0 / 157</div>
                    <div class="stat-label">Dersler</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-rate">0%</div>
                    <div class="stat-label">Genel Başarı</div>
                </div>
            </div>

            <div style="margin-top: 12px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                    <span>Ders İlerleme Oranı</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="audio-test-row">
                <button class="btn" id="test-notif-btn" style="flex: 1; justify-content: center; font-size: 0.8rem;"><i data-lucide="play"></i> Bildirim Test</button>
                <button class="btn" id="test-alarm-btn" style="flex: 1; justify-content: center; font-size: 0.8rem;"><i data-lucide="play"></i> Alarm Test</button>
            </div>

            <button class="btn btn-danger" id="clear-all-btn" style="margin-top: 12px; font-size: 0.8rem;">
                <i data-lucide="trash-2"></i> Tüm Verileri Sıfırla
            </button>
        </div>
    </div>
</div>

<script>
    function safeIcons() {
        try {
            if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        } catch (e) { console.warn('İkonlar yüklenemedi:', e); }
    }
    function readStore(key, fallback) {
        try { var value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; }
        catch (e) { return fallback; }
    }
    function writeStore(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    var activeAlarmAudio = null;
    var isAlarmPlaying = false;
    var lastTriggeredSlotId = null;

    // Tam Ekran Düğmesi (Samsung Tab 3 Lite Uyumlu)
    document.getElementById('fullscreen-btn').addEventListener('click', function() {
        var doc = document.documentElement;
        if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement) {
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            else if (doc.mozRequestFullScreen) doc.mozRequestFullScreen();
            else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    });

    // Ses Çalma Fonksiyonu (Kesintisiz Döngüsel Alarm)
    function playAudio(type) {
        if (!type) type = 'notif';
        var fileName = (type === 'alarm') ? 'alarm.mp3' : 'bildirim.mp3';

        try {
            var audio = new Audio(fileName);
            if (type === 'alarm') {
                if (isAlarmPlaying) return;
                isAlarmPlaying = true;
                audio.loop = true;
                activeAlarmAudio = audio;

                audio.play().catch(function(err) {
                    console.log("Alarm çalınamadı:", err);
                    isAlarmPlaying = false;
                });
            } else {
                audio.play().catch(function(err) { console.log("Bildirim çalınamadı:", err); });
            }
        } catch (e) {
            console.log("Ses hatası:", e);
            if (type === 'alarm') isAlarmPlaying = false;
        }
    }

    document.getElementById('test-notif-btn').addEventListener('click', function() { playAudio('notif'); });
    document.getElementById('test-alarm-btn').addEventListener('click', function() {
        document.getElementById('alarm-banner').classList.add('active');
        playAudio('alarm');
    });

    function triggerPersistentAlarm() {
        document.getElementById('alarm-banner').classList.add('active');
        playAudio('alarm');
    }

    document.getElementById('btn-stop-alarm').addEventListener('click', function() {
        document.getElementById('alarm-banner').classList.remove('active');
        if (activeAlarmAudio) {
            activeAlarmAudio.pause();
            activeAlarmAudio.currentTime = 0;
            activeAlarmAudio = null;
        }
        isAlarmPlaying = false;
    });

    function switchTab(tabName) {
        var contents = document.querySelectorAll('.tab-content');
        for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active');
        
        var btns = document.querySelectorAll('.tab-btn');
        for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
        
        if (tabName === 'routine') {
            document.getElementById('tab-routine').classList.add('active');
            document.querySelector(".tab-btn[onclick*=\"" + tabName + "\"]").classList.add('active');
            scrollToActiveRoutine();
        } else {
            document.getElementById('tab-courses').classList.add('active');
            document.querySelector(".tab-btn[onclick*=\"" + tabName + "\"]").classList.add('active');
            scrollToLastCourse();
        }
        safeIcons();
    }

    // RUTİN BLOKLARI
    var routineBlocks = [
        { title: "Sabah Hazırlığı", items: [
            { id: 'r1', type: 'normal', time: "07:00 - 07:30", title: "Uyanış ve Egzersiz (10 Şınav, 10 Mekik)", completed: false },
            { id: 'r2', type: 'normal', time: "07:30 - 08:30", title: "Kahvaltı & Güne Hazırlık", completed: false }
        ]},
        { title: "Blok 1 (Temel Bilimler / Linux & Ağ)", items: [
            { id: 'r3', type: 'pomo', duration: 25, time: "08:30 - 08:55", title: "Pomo 1: Odaklanma & Çalışma", completed: false },

            { id: 'r5', type: 'pomo', duration: 25, time: "09:00 - 09:25", title: "Pomo 2: Çalışmaya Devam", completed: false },
            { id: 'r6', type: 'break', duration: 5, time: "09:25 - 09:30", title: "Mola 2: Kısa Dinlenme", completed: false },

            { id: 'r10', type: 'break', duration: 15, time: "10:25 - 10:40", title: "Uzun Mola & Esneme (15 Dk)", completed: false },
            { id: 'r11', type: 'pomo', duration: 25, time: "10:40 - 11:05", title: "Pomo 5: Çalışma Oturumu", completed: false },
            { id: 'r12', type: 'break', duration: 5, time: "11:05 - 11:10", title: "Mola 5: Kısa Dinlenme", completed: false },
            { id: 'r13', type: 'pomo', duration: 25, time: "11:10 - 11:35", title: "Pomo 6: Çalışma Oturumu", completed: false },

        { title: "Blok 2 (Uygulamalı Çalışma / Lab)", items: [
            { id: 'r18', type: 'pomo', duration: 25, time: "13:30 - 13:55", title: "Pomo 1: Lab Ortamı Kurulumu", completed: false },
            { id: 'r19', type: 'break', duration: 5, time: "13:55 - 14:00", title: "Mola 1", completed: false },
            { id: 'r20', type: 'pomo', duration: 25, time: "14:00 - 14:25", title: "Pomo 2: Komut Satırı Pratiği", completed: false },
            { id: 'r21', type: 'break', duration: 5, time: "14:25 - 14:30", title: "Mola 2", completed: false },

        var now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR');
        document.getElementById('date-display').innerText = now.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        syncAutoPomodoro(now);
    }

    var activeRoutineItemId = null;

    // OTOMATİK AKILLI POMODORO SENKRONİZASYONU
    function syncAutoPomodoro(now) {
        var currentMinutes = now.getHours() * 60 + now.getMinutes();
        var currentSeconds = now.getSeconds();

        var activeSlot = null;

        for (var i = 0; i < routineBlocks.length; i++) {
            for (var j = 0; j < routineBlocks[i].items.length; j++) {
                var item = routineBlocks[i].items[j];
                var parts = item.time.split(' - ');
                var startParts = parts[0].split(':').map(Number);
                var endParts = parts[1].split(':').map(Number);
                
                var startMin = startParts[0] * 60 + startParts[1];
                var endMin = endParts[0] * 60 + endParts[1];

                if (endMin > startMin && currentMinutes >= startMin && currentMinutes < endMin) {
                    activeSlot = {
                        item: item,
                        startMin: startMin,
                        endMin: endMin
                    };
                    break;
                }
            }
            if (activeSlot) break;
        }

        var displayEl = document.getElementById('pomo-display');
        var cardTitleEl = document.getElementById('pomo-card-title');
        var labelEl = document.getElementById('pomo-mode-label');
        var infoEl = document.getElementById('pomo-info-text');

        if (activeSlot) {
            activeRoutineItemId = activeSlot.item.id;

            var totalSlotSeconds = (activeSlot.endMin - activeSlot.startMin) * 60;
            var elapsedSeconds = ((currentMinutes - activeSlot.startMin) * 60) + currentSeconds;
            var remainingSeconds = Math.max(0, totalSlotSeconds - elapsedSeconds);

            var m = String(Math.floor(remainingSeconds / 60));
            if (m.length < 2) m = '0' + m;
            var sec = String(remainingSeconds % 60);
            if (sec.length < 2) sec = '0' + sec;

            displayEl.innerText = m + ':' + sec;
            
            cardTitleEl.innerHTML = '<i data-lucide="timer"></i> ' + activeSlot.item.title;

            if (activeSlot.item.type === 'break') {
                labelEl.innerText = "Mola / Dinlenme";
                labelEl.style.color = 'var(--accent-green)';
            } else if (activeSlot.item.type === 'pomo') {
                labelEl.innerText = "Odaklanma";
                labelEl.style.color = 'var(--accent-purple)';
            } else {
                labelEl.innerText = "Genel Plan";
                labelEl.style.color = 'var(--accent-blue)';
            }

            infoEl.innerText = "Anlık zaman dilimi otomatik senkronize ediliyor.";

            if (remainingSeconds <= 1) {
                if (lastTriggeredSlotId !== activeSlot.item.id) {
                    lastTriggeredSlotId = activeSlot.item.id;
                    toggleRoutine(activeSlot.item.id, true);
                    triggerPersistentAlarm();
                }
            }
        } else {
            activeRoutineItemId = null;
            displayEl.innerText = "00:00";
            cardTitleEl.innerHTML = '<i data-lucide="timer"></i> Serbest Zaman';
            labelEl.innerText = "Boşta";
            labelEl.style.color = "var(--text-muted)";
            infoEl.innerText = "Şu an tanımlı bir rutin dilimi bulunmuyor.";
        }

        safeIcons();
        renderRoutineHighlights();
    }

    function renderRoutineHighlights() {
        var items = document.querySelectorAll('.routine-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.remove('active-pomo-row');
        }
        if (activeRoutineItemId) {
            var activeEl = document.getElementById('item-' + activeRoutineItemId);
            if (activeEl) {
                activeEl.classList.add('active-pomo-row');
            }
        }
    }

    // Kart İçi Otomatik Kaydırma (Ekranı değil, sadece ilgili listeyi kaydırır)
    function scrollToActiveRoutine() {
        setTimeout(function() {
            var activeRow = document.querySelector('#routine-container .routine-item.active-pomo-row');
            if (activeRow) {
                try { activeRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
            }
        }, 100);
    }

    function scrollToLastCourse() {
        setTimeout(function() {
            var container = document.getElementById('course-container');
            var firstUncompleted = container.querySelector('.routine-item:not(.completed)');
            if (firstUncompleted) {
                try { firstUncompleted.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
            }
        }, 100);
    }

    function renderRoutine() {
        var container = document.getElementById('routine-container');
        container.innerHTML = '';

        for (var i = 0; i < routineBlocks.length; i++) {
            var mod = routineBlocks[i];
            var header = document.createElement('div');
            header.className = 'section-title';
            header.innerHTML = '<i data-lucide="list-checks" style="width:16px;"></i> ' + mod.title;
            container.appendChild(header);

            for (var j = 0; j < mod.items.length; j++) {
                var item = mod.items[j];
                var isActivePomo = (activeRoutineItemId === item.id);
                var div = document.createElement('div');
                div.id = 'item-' + item.id;
                div.className = 'routine-item ' + (item.completed ? 'completed ' : '') + (isActivePomo ? 'active-pomo-row' : '');
                div.innerHTML = 
                    '<div class="item-info">' +
                        '<span class="item-time">' + item.time + '</span>' +
                        '<span class="item-title">' + item.title + '</span>' +
                    '</div>' +
                    '<div class="action-box">' +
                        '<button class="check-btn" onclick="toggleRoutine(\'' + item.id + '\')">' +
                            (item.completed ? '<i data-lucide="check"></i>' : '') +
                        '</button>' +
                    '</div>';
                container.appendChild(div);
            }
        }
        safeIcons();
        updateStats();
    }

    function toggleRoutine(id, forcedState) {
        if (forcedState === undefined) forcedState = null;
        for (var i = 0; i < routineBlocks.length; i++) {
            for (var j = 0; j < routineBlocks[i].items.length; j++) {
                var item = routineBlocks[i].items[j];
                if (item.id === id) {
                    item.completed = forcedState !== null ? forcedState : !item.completed;
                    savedRoutine[id] = item.completed;
                }
            }
        }
        writeStore('routine_progress_v5', savedRoutine);
        renderRoutine();
    }

    function renderCourses() {
        var container = document.getElementById('course-container');
        container.innerHTML = '';

        for (var i = 0; i < courseModules.length; i++) {
            var mod = courseModules[i];
            var header = document.createElement('div');
            header.className = 'section-title';
            header.innerHTML = '<i data-lucide="folder" style="width:16px;"></i> ' + mod.title;
            container.appendChild(header);

            for (var j = 0; j < mod.items.length; j++) {
                var item = mod.items[j];
                var div = document.createElement('div');
                div.className = 'routine-item ' + (item.completed ? 'completed' : '');
                div.innerHTML = 
                    '<div class="item-info">' +
                        '<span class="item-time">' + item.time + '</span>' +
                        '<span class="item-title">' + item.title + '</span>' +
                    '</div>' +
                    '<div class="action-box">' +
                        '<button class="check-btn" onclick="toggleCourse(' + item.id + ')">' +
                            (item.completed ? '<i data-lucide="check"></i>' : '') +
                        '</button>' +
                    '</div>';
                container.appendChild(div);
            }
        }

        safeIcons();
        updateStats();
    }

    function toggleCourse(id) {
        for (var i = 0; i < courseModules.length; i++) {
            for (var j = 0; j < courseModules[i].items.length; j++) {
                var item = courseModules[i].items[j];
                if (item.id === id) {
                    item.completed = !item.completed;
                    savedCourses[id] = item.completed;
                }
            }
        }

        writeStore('course_progress_v5', savedCourses);
        renderCourses();
    }

    function updateStats() {
        var routineTotal = 0;
        var routineCompleted = 0;
        for (var i = 0; i < routineBlocks.length; i++) {
            for (var j = 0; j < routineBlocks[i].items.length; j++) {
                routineTotal++;
                if (routineBlocks[i].items[j].completed) routineCompleted++;
            }
        }
        var routineRate = routineTotal > 0 ? Math.round((routineCompleted / routineTotal) * 100) : 0;

        var courseTotal = 0;
        var courseCompleted = 0;
        for (var k = 0; k < courseModules.length; k++) {
            for (var m = 0; m < courseModules[k].items.length; m++) {
                courseTotal++;
                if (courseModules[k].items[m].completed) courseCompleted++;
            }
        }
        var courseRate = courseTotal > 0 ? Math.round((courseCompleted / courseTotal) * 100) : 0;

        var overallRate = Math.round((routineRate + courseRate) / 2);

        document.getElementById('stat-routine-rate').innerText = routineRate + '%';
        document.getElementById('stat-completed-count').innerText = courseCompleted + ' / ' + courseTotal;
        document.getElementById('stat-rate').innerText = overallRate + '%';
        document.getElementById('progress-text').innerText = courseRate + '%';
        document.getElementById('progress-fill').style.width = courseRate + '%';
    }

    document.getElementById('reset-routine-btn').addEventListener('click', function() {
        if (confirm("Günlük rutini sıfırlamak istediğinize emin misiniz?")) {
            for (var i = 0; i < routineBlocks.length; i++) {
                for (var j = 0; j < routineBlocks[i].items.length; j++) {
                    routineBlocks[i].items[j].completed = false;
                }
            }
            savedRoutine = {};
            localStorage.removeItem('routine_progress_v5');
            renderRoutine();
        }
    });

    document.getElementById('reset-courses-btn').addEventListener('click', function() {
        if (confirm("Eğitim ilerlemelerini sıfırlamak istediğinize emin misiniz?")) {
            for (var i = 0; i < courseModules.length; i++) {
                for (var j = 0; j < courseModules[i].items.length; j++) {
                    courseModules[i].items[j].completed = false;
                }
            }
            savedCourses = {};
            localStorage.removeItem('course_progress_v5');
            renderCourses();
        }
    });

    document.getElementById('clear-all-btn').addEventListener('click', function() {
        if (confirm("Tüm verileriniz tamamen silinecek. Emin misiniz?")) {
            localStorage.clear();
            location.reload();
        }
    });

    setInterval(updateClock, 1000);
    renderRoutine();
    renderCourses();
    updateClock();
    scrollToActiveRoutine();
    document.addEventListener('visibilitychange', function() { if (!document.hidden) { updateClock(); } });
    window.addEventListener('pageshow', function() { updateClock(); });
</script>

</body>
