 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuzluğa Söz Verdik</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Quicksand:wght@300;400&display=swap');

        body { 
            margin: 0; background: #faf3ef; color: #4a3728; 
            font-family: 'Quicksand', sans-serif; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; min-height: 100vh; 
        }

        .hero { text-align: center; padding: 20px; animation: slideIn 1.5s ease-out; }
        .names { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 10px 0; color: #8b4513; }
        .romantic-quote { font-style: italic; font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 280px; }
        .btn { 
            background: #fff; border: 1px solid #c9b0a1; color: #8b4513; 
            padding: 14px; cursor: pointer; transition: 0.3s; border-radius: 8px; font-size: 0.9rem;
        }
        .btn:hover { background: #8b4513; color: #fff; box-shadow: 0 4px 15px rgba(139, 69, 19, 0.2); }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 20; }
        .m-card { background: #fff; padding: 35px; border-radius: 20px; text-align: center; max-width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="hero">
        <div style="letter-spacing: 3px; opacity: 0.7;">BİZİM HİKAYEMİZ</div>
        <div class="names">Sinan & Rabia</div>
        <div class="romantic-quote">
            "İki kalbin birleştiği o en kıymetli ana,<br>
            tüm sevdamızla sizi de bekliyoruz..."
        </div>
    </div>

    <div class="btn-group">
        <button class="btn" onclick="show('ÇEYİZ', 'Mutluluk dolu yuvamızın hazırlığına bekliyoruz.', '21 Haziran 2026, Pazar | Saat: 13.00', false, '')">ÇEYİZ</button>
        <button class="btn" onclick="show('KINA', 'Geleneksel bir akşamın sıcaklığında buluşalım.', '03 Temmuz 2026, Cuma | 20.00-23.00<br>Yılmazlar Plaza Salon Yıldız', true, 'https://maps.app.goo.gl/fkNWfCkF4hN1bVz18?g_st=ac')">KINA</button>
        <button class="btn" onclick="show('DÜĞÜN', 'Hayatımızın en özel gününde şahidimiz olun.', '05 Temmuz 2026, Pazar | 16.00-19.00<br>Yılmazlar Plaza Salon Yıldız', true, 'https://maps.app.goo.gl/fkNWfCkF4hN1bVz18?g_st=ac')">DÜĞÜN</button>
    </div>

    <div id="modal" onclick="this.style.display='none'">
        <div class="m-card">
            <h2 id="m-title" style="color:#8b4513; font-family: 'Playfair Display', serif;"></h2>
            <p id="m-desc" style="font-style: italic; margin-bottom: 15px;"></p>
            <p id="m-body" style="font-weight: bold;"></p>
            <button id="loc-btn" class="btn" style="margin-top:20px; display:none;" onclick="openMap()">HARİTADA GÖSTER</button>
        </div>
    </div>

    <script>
        let currentMapLink = '';
        function show(t, d, b, showLoc, mapLink) {
            document.getElementById('m-title').innerText = t;
            document.getElementById('m-desc').innerText = d;
            document.getElementById('m-body').innerHTML = b;
            currentMapLink = mapLink;
            document.getElementById('loc-btn').style.display = showLoc ? 'block' : 'none';
            document.getElementById('modal').style.display = 'flex';
        }
        function openMap() { window.open(currentMapLink); }
    </script>
</body>
</html>
