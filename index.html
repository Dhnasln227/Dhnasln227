<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duhan Aslan Şafak - HUD Full Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --neon: #00ff41; 
            --danger: #ff3e3e; 
            --info: #00d4ff; 
            --warning: #f1c40f;
            --bg: #050505; 
            --panel-bg: rgba(10, 10, 10, 0.95);
        }

        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh;
            text-transform: uppercase;
            overflow: hidden;
        }

        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(0, 255, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            background-size: 100% 4px, 3px 100%;
            z-index: 2000;
            pointer-events: none;
        }

        .map-panel { 
            width: 100%;
            height: 40vh; 
            position: relative; 
            border-bottom: 3px solid var(--neon);
            filter: brightness(0.9) contrast(1.1);
            flex-shrink: 0;
        }
        #map { width: 100%; height: 100%; background: #000; }

        .radar-hattı {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent, rgba(0, 255, 65, 0.1), transparent);
            background-size: 100% 100px;
            animation: radarTara 4s linear infinite;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes radarTara { 0% { background-position: 0 -100px; } 100% { background-position: 0 40vh; } }

        .bilgi-ekrani { 
            position: absolute; 
            bottom: 10px; 
            left: 10px; 
            right: 10px; 
            background: rgba(0, 0, 0, 0.85); 
            padding: 10px; 
            z-index: 1000;
            border-left: 4px solid var(--neon);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #il-adi { margin: 0; font-size: 18px; color: var(--neon); }
        #city-desc { margin-top: 5px; font-size: 10px; color: #aaa; text-transform: none; line-height: 1.2; }

        .data-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            flex-grow: 1;
            padding-bottom: 40px;
        }

        .bar-section {
            background: var(--panel-bg);
            padding: 10px;
            border: 1px solid #1a1a1a;
        }

        .bar-label { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 5px; color: var(--neon); }
        .bar-bg { height: 8px; background: #000; border: 1px solid #333; margin-bottom: 8px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 1s ease-in-out; }

        .safak-display {
            text-align: center;
            padding: 10px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid #1a1a1a;
        }

        .big-safak { 
            font-size: 70px; 
            font-weight: 900; 
            color: var(--neon); 
            margin: 0; 
            line-height: 1;
        }

        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
        }
        .card { 
            background: #0a0a0a; 
            padding: 12px; 
            border: 1px solid #1a1a1a;
        }
        .card label { display: block; font-size: 8px; color: #666; margin-bottom: 4px; }
        .card span { font-size: 16px; font-weight: bold; color: #eee; }

    </style>
</head>

            document.getElementById("p-bar").style.width = p.toFixed(2) + "%";
            document.getElementById("p-percent").innerText = p.toFixed(2) + "%";
            document.getElementById("week-bar").style.width = haftaP.toFixed(2) + "%";
            document.getElementById("week-percent").innerText = haftaP.toFixed(0) + "%";

            birimler.forEach(u => {
                document.getElementById("k-"+u.id).innerText = Math.floor(farkK/u.d);
                document.getElementById("g-"+u.id).innerText = Math.floor(farkG/u.d);
            });

            if (kG >= 1 && kG <= 81) {
                const cityName = sehirIsimleri[kG];
                const cityPos = koordVerileri[kG];
                
                if (document.getElementById("il-adi").innerText !== "HEDEF: " + cityName.toUpperCase()) {
                    document.getElementById("il-adi").innerText = "HEDEF: " + cityName.toUpperCase();
                    document.getElementById("city-desc").innerText = "> DATA: " + (sehirVerileri[kG]);
                    map.flyTo(cityPos, 10, { duration: 3 });
                }
            } else {
                if (document.getElementById("il-adi").innerText !== "TARAMA MODU") {
                    document.getElementById("il-adi").innerText = "TARAMA MODU";
                    document.getElementById("city-desc").innerText = "> BEKLEMEDE: Stratejik operasyon süresi dışında.";
                    if (map.getZoom() > 6) map.flyTo([39.0, 35.0], 5);
                }
            }
        }
    </script>
</body>
</html>
