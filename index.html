<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ağ & Sistem Uzmanlığı Günlük Rutin (Tab 3 Lite Uyumlu)</title>
    <style>
        /* Android 4.2.2 Uyumluluğu için Düzeltilmiş CSS */
        body {
            background-color: #0d1117;
            color: #f3f4f6;
            font-family: Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }

        body.projection-mode {
            background-color: #000000 !important;
            color: #ffffff !important;
        }

        .container {
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .header-card {
            overflow: hidden;
        }

        .clock-box h1 {
            font-size: 1.8rem;
            margin: 0;
            color: #38bdf8;
        }

        .clock-box p {
            color: #9ca3af;
            font-size: 0.85rem;
            margin: 5px 0 0 0;
        }

        .top-controls {
            margin-top: 10px;
        }

        .alarm-banner {
            background: #7f1d1d;
            border: 2px solid #ef4444;
            border-radius: 8px;
            padding: 15px;
            display: none;
            margin-bottom: 15px;
        }

        .alarm-banner.active {
            display: block;
        }

        .btn-stop-alarm {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .section-title {
            font-size: 1rem;
            color: #38bdf8;
            margin: 15px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #30363d;
            font-weight: bold;
        }

        .scroll-area {
            max-height: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .routine-item {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .routine-item.completed {
            opacity: 0.5;
            background: #111;
        }

        .routine-item.completed .item-title {
            text-decoration: line-through;
        }

        .item-info {
            float: left;
            width: 80%;
        }

        .action-box {
            float: right;
            width: 18%;
            text-align: right;
        }

        .item-time {
            font-weight: bold;
            font-size: 0.75rem;
            color: #a855f7;
            background: #3b0764;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .item-title {
            font-size: 0.85rem;
            display: block;
        }

        .check-btn {
            background: transparent;
            border: 2px solid #484f58;
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .routine-item.completed .check-btn {
            background: #22c55e;
            border-color: #22c55e;
            color: #000000;
        }

        .pomodoro-card {
            text-align: center;
        }

        .pomo-timer {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: #a855f7;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #484f58;
            background: #21262d;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-block;
        }

        .btn-primary {
            background: #38bdf8;
            color: #000000;
            border: none;
            font-weight: bold;
        }

        .btn-danger {
            background: #7f1d1d;
            color: #f87171;
            border: 1px solid #ef4444;
            width: 100%;
            margin-top: 15px;
        }

        .stats-table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }

        .stats-table td {
            width: 33%;
            background: #21262d;
            border: 1px solid #30363d;
            padding: 8px 4px;
            text-align: center;
            border-radius: 6px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #9ca3af;
            margin-top: 2px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #21262d;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
        }

        .tab-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #9ca3af;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .tab-btn.active {
            background: #38bdf8;
            color: #000000;
            border-color: #38bdf8;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .clear {
            clear: both;
        }
    </style>
</head>
<body id="body">

<div class="container">
    <div class="card header-card">
        <div class="clock-box">
            <h1 id="clock">00:00:00</h1>
            <p id="date-display">Yükleniyor...</p>
        </div>
        <div class="top-controls">
            <button class="btn btn-primary" id="projection-toggle-btn">P70 Modu</button>
        </div>
    </div>

    <!-- ALARM BANNERI -->
    <div class="alarm-banner" id="alarm-banner">
        <strong style="font-size:1.1rem; color:#ffffff;">Süre Doldu!</strong>
        <p style="font-size:0.85rem; color: #fecaca; margin: 5px 0;">Alarm çalıyor. Alarmı kapatabilirsin.</p>
        <button class="btn-stop-alarm" id="btn-stop-alarm">Alarmı Durdur</button>
    </div>

    <div class="card pomodoro-card">
        <div style="overflow:hidden;">
            <span style="float:left; font-weight:bold;">Akıllı Pomodoro</span>
            <span id="pomo-mode-label" style="float:right; font-size: 0.85rem; color: #a855f7; font-weight:bold;">Hazır</span>
        </div>
        <div class="pomo-timer" id="pomo-display">25:00</div>
        <div class="pomo-controls">
            <button class="btn btn-primary" id="pomo-start-btn">Başlat</button>
            <button class="btn" id="pomo-reset-btn">Sıfırla</button>
        </div>
    </div>

    <div class="card">
        <div style="margin-bottom: 12px;">
            <button class="tab-btn active" id="btn-tab-routine" onclick="switchTab('routine')">Günlük Rutin</button>
            <button class="tab-btn" id="btn-tab-courses" onclick="switchTab('courses')">Eğitim Planı</button>
        </div>

        <div id="tab-routine" class="tab-content active">
            <div style="overflow:hidden; margin-bottom: 10px;">
                <h3 style="color: #38bdf8; float:left; margin:0; font-size:0.95rem;">Pazartesi / Pomodoro Akışı</h3>
                <button class="btn" id="reset-routine-btn" style="float:right; padding: 4px 8px; font-size: 0.75rem;">Sıfırla</button>
            </div>
            <div class="scroll-area" id="routine-container"></div>
        </div>

        <div id="tab-courses" class="tab-content">
            <div style="overflow:hidden; margin-bottom: 10px;">
                <h3 style="color: #38bdf8; float:left; margin:0; font-size:0.95rem;">Tüm Modül ve Dersler</h3>
                <button class="btn" id="reset-courses-btn" style="float:right; padding: 4px 8px; font-size: 0.75rem;">Sıfırla</button>
            </div>
            <div class="scroll-area" id="course-container"></div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; font-size:1rem;">Genel İlerleme Durumu</h3>
        
        <table class="stats-table">
            <tr>
                <td>
                    <div class="stat-value" id="stat-routine-rate">0%</div>
                    <div class="stat-label">Günlük Rutin</div>
                </td>
                <td>
                    <div class="stat-value" id="stat-completed-count">0 / 157</div>
                    <div class="stat-label">Dersler</div>
                </td>
                <td>
                    <div class="stat-value" id="stat-rate">0%</div>
                    <div class="stat-label">Genel Başarı</div>
                </td>
            </tr>
        </table>

        <div style="margin-top: 15px;">
            <div style="overflow:hidden; font-size: 0.85rem;">
                <span style="float:left;">Ders İlerleme Oranı</span>
                <span id="progress-text" style="float:right;">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div style="margin-top: 15px;">
            <label style="font-size:0.85rem;">
                <input type="checkbox" id="sound-toggle" checked> Sesli Uyarılar Açık
            </label>
        </div>

        <div style="margin-top: 10px;">
            <button class="btn" id="test-notif-btn" style="width:48%;">Bildirim Test</button>
            <button class="btn" id="test-alarm-btn" style="width:48%; float:right;">Alarm Test</button>
        </div>

        <button class="btn btn-danger" id="clear-all-btn">Tüm Verileri Sıfırla</button>
    </div>
</div>

<script>
    /* Android 4.2.2 (ES5) Uyumlu JavaScript - Sayaç Döngüsü Düzeltildi[cite: 1] */
    var activeAlarmAudio = null;
    var isAlarmPlaying = false;

    function playAudio(type) {
        type = type || 'notif';
        var soundEnabled = document.getElementById('sound-toggle').checked;
        if (!soundEnabled) return;

        var fileName = (type === 'alarm') ? 'alarm.mp3' : 'bildirim.mp3';

        try {
            var audio = new Audio(fileName);
            if (type === 'alarm') {
                if (isAlarmPlaying) return;
                isAlarmPlaying = true;
                activeAlarmAudio = audio;
                audio.play();

                audio.onended = function() {
                    isAlarmPlaying = false;
                    var banner = document.getElementById('alarm-banner');
                    if (banner && banner.className.indexOf('active') !== -1) {
                        setTimeout(function() {
                            if (banner.className.indexOf('active') !== -1) {
                                playAudio('alarm');
                            }
                        }, 3000);
                    }
                };
            } else {
                audio.play();
            }
        } catch (e) {
            if (type === 'alarm') isAlarmPlaying = false;
        }
    }

    document.getElementById('test-notif-btn').onclick = function() { playAudio('notif'); };
    document.getElementById('test-alarm-btn').onclick = function() {
        document.getElementById('alarm-banner').className = 'alarm-banner active';
        playAudio('alarm');
    };

    document.getElementById('btn-stop-alarm').onclick = function() {
        document.getElementById('alarm-banner').className = 'alarm-banner';
        if (activeAlarmAudio) {
            activeAlarmAudio.pause();
            activeAlarmAudio = null;
        }
        isAlarmPlaying = false;
    };

    function switchTab(tabName) {
        document.getElementById('tab-routine').className = 'tab-content';
        document.getElementById('tab-courses').className = 'tab-content';
        document.getElementById('btn-tab-routine').className = 'tab-btn';
        document.getElementById('btn-tab-courses').className = 'tab-btn';
        
        if (tabName === 'routine') {
            document.getElementById('tab-routine').className = 'tab-content active';
            document.getElementById('btn-tab-routine').className = 'tab-btn active';
        } else {
            document.getElementById('tab-courses').className = 'tab-content active';
            document.getElementById('btn-tab-courses').className = 'tab-btn active';
        }
    }

    var routineBlocks = [
        { title: "Sabah Hazırlığı", items: [
            { id: 'r1', type: 'normal', time: "07:00 - 07:30", title: "Uyanış ve Egzersiz (10 Şınav, 10 Mekik)", completed: false },
            { id: 'r2', type: 'normal', time: "07:30 - 08:30", title: "Kahvaltı & Güne Hazırlık", completed: false }
        ]},
        { title: "Blok 1 (Temel Bilimler / Linux & Ağ)", items: [
            { id: 'r3', type: 'pomo', duration: 25, time: "08:30 - 08:55", title: "Pomo 1: Odaklanma & Çalışma", completed: false },
            { id: 'r4', type: 'break', duration: 5, time: "08:55 - 09:00", title: "Mola 1: Kısa Dinlenme", completed: false },
            { id: 'r5', type: 'pomo', duration: 25, time: "09:00 - 09:25", title: "Pomo 2: Çalışmaya Devam", completed: false },
            { id: 'r6', type: 'break', duration: 5, time: "09:25 - 09:30", title: "Mola 2: Kısa Dinlenme", completed: false },
            { id: 'r7', type: 'pomo', duration: 25, time: "09:30 - 09:55", title: "Pomo 3: Konu Pratiği", completed: false },
            { id: 'r8', type: 'break', duration: 5, time: "09:55 - 10:00", title: "Mola 3: Kısa Dinlenme", completed: false },
            { id: 'r9', type: 'pomo', duration: 25, time: "10:00 - 10:25", title: "Pomo 4: Çalışma Oturumu", completed: false },
            { id: 'r10', type: 'break', duration: 15, time: "10:25 - 10:40", title: "Uzun Mola & Esneme (15 Dk)", completed: false },
            { id: 'r11', type: 'pomo', duration: 25, time: "10:40 - 11:05", title: "Pomo 5: Çalışma Oturumu", completed: false },
            { id: 'r12', type: 'break', duration: 5, time: "11:05 - 11:10", title: "Mola 5: Kısa Dinlenme", completed: false },
            { id: 'r13', type: 'pomo', duration: 25, time: "11:10 - 11:35", title: "Pomo 6: Çalışma Oturumu", completed: false },
            { id: 'r14', type: 'break', duration: 5, time: "11:35 - 11:40", title: "Mola 6: Kısa Dinlenme", completed: false },
            { id: 'r15', type: 'pomo', duration: 25, time: "11:40 - 12:05", title: "Pomo 7: Blok Kapanış Çalışması", completed: false },
            { id: 'r16', type: 'normal', time: "12:05 - 12:30", title: "Blok Özeti ve Toparlanma", completed: false }
        ]},
        { title: "Öğle Arası", items: [
            { id: 'r17', type: 'normal', time: "12:30 - 13:30", title: "Öğle Arası ve Dinlenme", completed: false }
        ]},
        { title: "Blok 2 (Uygulamalı Çalışma / Lab)", items: [
            { id: 'r18', type: 'pomo', duration: 25, time: "13:30 - 13:55", title: "Pomo 1: Lab Ortamı Kurulumu", completed: false },
            { id: 'r19', type: 'break', duration: 5, time: "13:55 - 14:00", title: "Mola 1", completed: false },
            { id: 'r20', type: 'pomo', duration: 25, time: "14:00 - 14:25", title: "Pomo 2: Komut Satırı Pratiği", completed: false },
            { id: 'r21', type: 'break', duration: 5, time: "14:25 - 14:30", title: "Mola 2", completed: false },
            { id: 'r22', type: 'pomo', duration: 25, time: "14:30 - 14:55", title: "Pomo 3: Uygulama Çalışması", completed: false },
            { id: 'r23', type: 'break', duration: 5, time: "14:55 - 15:00", title: "Mola 3", completed: false },
            { id: 'r24', type: 'pomo', duration: 25, time: "15:00 - 15:25", title: "Pomo 4: Uygulama Çalışması", completed: false },
            { id: 'r25', type: 'break', duration: 15, time: "15:25 - 15:40", title: "Uzun Mola (15 Dk)", completed: false },
            { id: 'r26', type: 'pomo', duration: 25, time: "15:40 - 16:05", title: "Pomo 5: Lab Senaryoları", completed: false },
            { id: 'r27', type: 'break', duration: 5, time: "16:05 - 16:10", title: "Mola 5", completed: false },
            { id: 'r28', type: 'pomo', duration: 25, time: "16:10 - 16:35", title: "Pomo 6: Lab Senaryoları", completed: false },
            { id: 'r29', type: 'break', duration: 5, time: "16:35 - 16:40", title: "Mola 6", completed: false },
            { id: 'r30', type: 'pomo', duration: 25, time: "16:40 - 17:05", title: "Pomo 7: Sorun Giderme", completed: false },
            { id: 'r31', type: 'normal', time: "17:05 - 17:30", title: "Blok Sonu Değerlendirme", completed: false }
        ]},
        { title: "Akşamüstü", items: [
            { id: 'r32', type: 'normal', time: "17:30 - 18:30", title: "Akşamüstü Molası ve Dinlenme", completed: false }
        ]},
        { title: "Blok 3 (Tekrar ve Proje Geliştirme)", items: [
            { id: 'r33', type: 'pomo', duration: 25, time: "18:30 - 18:55", title: "Pomo 1: Günlük Konu Tekrarı", completed: false },
            { id: 'r34', type: 'break', duration: 5, time: "18:55 - 19:00", title: "Mola 1", completed: false },
            { id: 'r35', type: 'pomo', duration: 25, time: "19:00 - 19:25", title: "Pomo 2: Proje Geliştirme", completed: false },
            { id: 'r36', type: 'break', duration: 5, time: "19:25 - 19:30", title: "Mola 2", completed: false },
            { id: 'r37', type: 'pomo', duration: 25, time: "19:30 - 19:55", title: "Pomo 3: Proje Geliştirme", completed: false },
            { id: 'r38', type: 'break', duration: 5, time: "19:55 - 20:00", title: "Mola 3", completed: false },
            { id: 'r39', type: 'normal', time: "20:00 - 20:30", title: "Günlük Notlar ve Kapanış", completed: false }
        ]},
        { title: "Akşam Kapanışı", items: [
            { id: 'r40', type: 'normal', time: "20:30 - 22:00", title: "Akşam Yemeği ve Serbest Zaman", completed: false },
            { id: 'r41', type: 'normal', time: "22:00 - 23:00", title: "Günlük Değerlendirme ve Ertesi Gün Planı", completed: false },
            { id: 'r42', type: 'normal', time: "23:00 - 07:00", title: "Yatış ve Dinlenme", completed: false }
        ]}
    ];

    var courseModules = [
        { title: "1. Giriş", items: [{ id: 1, time: "00:02:08", title: "1.1_Tanıtım", completed: true }, { id: 2, time: "00:07:49", title: "1.2_Bilgilendirme", completed: true }]},
        { title: "2. Ağlar ve Katmanlı Yapı", items: [
            { id: 3, time: "00:11:36", title: "2.1_Ağlara Giriş 1", completed: true },
            { id: 4, time: "00:11:00", title: "2.2_Ağlara Giriş 2", completed: false },
            { id: 5, time: "00:10:56", title: "2.3_Ağ Türleri 1", completed: false },
            { id: 6, time: "00:11:39", title: "2.4_Ağ Türleri 2", completed: false },
            { id: 7, time: "00:15:16", title: "2.5_İletişim Prensipleri", completed: false },
            { id: 8, time: "00:04:14", title: "2.6_İletişim Referans Modelleri 1", completed: false },
            { id: 9, time: "00:13:13", title: "2.7_İletişim Referans Modelleri 2", completed: false },
            { id: 10, time: "00:07:47", title: "2.8_Uygulama Katmanı", completed: false },
            { id: 11, time: "00:12:52", title: "2.9_Taşıma Katmanı 1", completed: false },
            { id: 12, time: "00:10:10", title: "2.10_Taşıma Katmanı 2", completed: false },
            { id: 13, time: "00:07:02", title: "2.11_Ağ Katmanı 1", completed: false },
            { id: 14, time: "00:11:50", title: "2.12_Ağ Katmanı 2", completed: false },
            { id: 15, time: "00:02:54", title: "2.13_Veri Bağlantısı Katmanı 1", completed: false },
            { id: 16, time: "00:04:26", title: "2.14_Veri Bağlantısı Katmanı 2", completed: false },
            { id: 17, time: "00:09:58", title: "2.15_Fiziksel Katman", completed: false },
            { id: 18, time: "00:09:19", title: "2.16_Fiziksel Katman", completed: false }
        ]}
    ];

    var savedRoutine = {};
    var savedCourses = {};
    try {
        savedRoutine = JSON.parse(localStorage.getItem('routine_progress_v5')) || {};
        savedCourses = JSON.parse(localStorage.getItem('course_progress_v5')) || {};
    } catch(e) {}

    for (var i = 0; i < routineBlocks.length; i++) {
        for (var j = 0; j < routineBlocks[i].items.length; j++) {
            var item = routineBlocks[i].items[j];
            if (savedRoutine[item.id] !== undefined) item.completed = savedRoutine[item.id];
        }
    }

    for (var i = 0; i < courseModules.length; i++) {
        for (var j = 0; j < courseModules[i].items.length; j++) {
            var item = courseModules[i].items[j];
            if (savedCourses[item.id] !== undefined) item.completed = savedCourses[item.id];
        }
    }

    var projBtn = document.getElementById('projection-toggle-btn');
    var isProjectionMode = localStorage.getItem('projectionMode') === 'true';
    if (isProjectionMode) {
        document.getElementById('body').className = 'projection-mode';
    }

    projBtn.onclick = function() {
        isProjectionMode = !isProjectionMode;
        document.getElementById('body').className = isProjectionMode ? 'projection-mode' : '';
        localStorage.setItem('projectionMode', isProjectionMode);
    };

    function updateClock() {
        var now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
        document.getElementById('date-display').innerText = now.toLocaleDateString();
    }

    var pomoTimer = null;
    var pomoSeconds = 25 * 60;

    function updatePomoDisplay() {
        var m = Math.floor(pomoSeconds / 60);
        var s = pomoSeconds % 60;
        document.getElementById('pomo-display').innerText = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    document.getElementById('pomo-start-btn').onclick = function() {
        if (pomoTimer) {
            clearInterval(pomoTimer);
            pomoTimer = null;
            document.getElementById('pomo-start-btn').innerText = 'Devam Et';
            return;
        }

        document.getElementById('pomo-start-btn').innerText = 'Duraklat';
        pomoTimer = setInterval(function() {
            pomoSeconds--;
            updatePomoDisplay();
            
            if (pomoSeconds <= 0) {
                clearInterval(pomoTimer);
                pomoTimer = null;
                
                playAudio('notif');
                var banner = document.getElementById('alarm-banner');
                if (banner) banner.className = 'alarm-banner active';

                // Sayaç sıfırlandığında otomatik olarak başa dön ve hazır hale getir (Sayfa yenileme gerektirmez)
                pomoSeconds = 25 * 60;
                updatePomoDisplay();
                document.getElementById('pomo-mode-label').innerText = "Süre Tamamlandı / Hazır";
                document.getElementById('pomo-start-btn').innerText = 'Başlat';
            }
        }, 1000);
    };

    document.getElementById('pomo-reset-btn').onclick = function() {
        if (pomoTimer) clearInterval(pomoTimer);
        pomoTimer = null;
        pomoSeconds = 25 * 60;
        document.getElementById('pomo-mode-label').innerText = "Hazır";
        document.getElementById('pomo-start-btn').innerText = 'Başlat';
        updatePomoDisplay();
    };

    function renderRoutine() {
        var container = document.getElementById('routine-container');
        container.innerHTML = '';

        for (var i = 0; i < routineBlocks.length; i++) {
            var mod = routineBlocks[i];
            var header = document.createElement('div');
            header.className = 'section-title';
            header.innerText = mod.title;
            container.appendChild(header);

            for (var j = 0; j < mod.items.length; j++) {
                var item = mod.items[j];
                var div = document.createElement('div');
                div.className = 'routine-item' + (item.completed ? ' completed' : '');
                div.innerHTML = '<div class="item-info">' +
                    '<span class="item-time">' + item.time + '</span>' +
                    '<span class="item-title">' + item.title + '</span>' +
                    '</div>' +
                    '<div class="action-box">' +
                    '<button class="check-btn" onclick="toggleRoutine(\'' + item.id + '\')">' + (item.completed ? '✓' : '') + '</button>' +
                    '</div><div class="clear"></div>';
                container.appendChild(div);
            }
        }
        updateStats();
    }

    function toggleRoutine(id) {
        for (var i = 0; i < routineBlocks.length; i++) {
            for (var j = 0; j < routineBlocks[i].items.length; j++) {
                var item = routineBlocks[i].items[j];
                if (item.id === id) {
                    item.completed = !item.completed;
                    savedRoutine[id] = item.completed;
                }
            }
        }
        localStorage.setItem('routine_progress_v5', JSON.stringify(savedRoutine));
        renderRoutine();
    }

    function renderCourses() {
        var container = document.getElementById('course-container');
        container.innerHTML = '';

        for (var i = 0; i < courseModules.length; i++) {
            var mod = courseModules[i];
            var header = document.createElement('div');
            header.className = 'section-title';
            header.innerText = mod.title;
            container.appendChild(header);

            for (var j = 0; j < mod.items.length; j++) {
                var item = mod.items[j];
                var div = document.createElement('div');
                div.className = 'routine-item' + (item.completed ? ' completed' : '');
                div.innerHTML = '<div class="item-info">' +
                    '<span class="item-time">' + item.time + '</span>' +
                    '<span class="item-title">' + item.title + '</span>' +
                    '</div>' +
                    '<div class="action-box">' +
                    '<button class="check-btn" onclick="toggleCourse(' + item.id + ')">' + (item.completed ? '✓' : '') + '</button>' +
                    '</div><div class="clear"></div>';
                container.appendChild(div);
            }
        }
        updateStats();
    }

    function toggleCourse(id) {
        for (var i = 0; i < courseModules.length; i++) {
            for (var j = 0; j < courseModules[i].items.length; j++) {
                var item = courseModules[i].items[j];
                if (item.id === id) {
                    item.completed = !item.completed;
                    savedCourses[id] = item.completed;
                }
            }
        }
        localStorage.setItem('course_progress_v5', JSON.stringify(savedCourses));
        renderCourses();
    }

    function updateStats() {
        var routineTotal = 0, routineCompleted = 0;
        for (var i = 0; i < routineBlocks.length; i++) {
            for (var j = 0; j < routineBlocks[i].items.length; j++) {
                routineTotal++;
                if (routineBlocks[i].items[j].completed) routineCompleted++;
            }
        }
        var routineRate = routineTotal > 0 ? Math.round((routineCompleted / routineTotal) * 100) : 0;

        var courseTotal = 0, courseCompleted = 0;
        for (var i = 0; i < courseModules.length; i++) {
            for (var j = 0; j < courseModules[i].items.length; j++) {
                courseTotal++;
                if (courseModules[i].items[j].completed) courseCompleted++;
            }
        }
        var courseRate = courseTotal > 0 ? Math.round((courseCompleted / courseTotal) * 100) : 0;
        var overallRate = Math.round((routineRate + courseRate) / 2);

        document.getElementById('stat-routine-rate').innerText = routineRate + '%';
        document.getElementById('stat-completed-count').innerText = courseCompleted + ' / ' + courseTotal;
        document.getElementById('stat-rate').innerText = overallRate + '%';
        document.getElementById('progress-text').innerText = courseRate + '%';
        document.getElementById('progress-fill').style.width = courseRate + '%';
    }

    document.getElementById('reset-routine-btn').onclick = function() {
        if (confirm("Günlük rutini sıfırlamak istiyor musunuz?")) {
            for (var i = 0; i < routineBlocks.length; i++) {
                for (var j = 0; j < routineBlocks[i].items.length; j++) {
                    routineBlocks[i].items[j].completed = false;
                }
            }
            savedRoutine = {};
            localStorage.removeItem('routine_progress_v5');
            renderRoutine();
        }
    };

    document.getElementById('reset-courses-btn').onclick = function() {
        if (confirm("Eğitim ilerlemelerini sıfırlamak istiyor musunuz?")) {
            for (var i = 0; i < courseModules.length; i++) {
                for (var j = 0; j < courseModules[i].items.length; j++) {
                    courseModules[i].items[j].completed = false;
                }
            }
            savedCourses = {};
            localStorage.removeItem('course_progress_v5');
            renderCourses();
        }
    };

    document.getElementById('clear-all-btn').onclick = function() {
        if (confirm("Tüm verileriniz silinecek. Emin misiniz?")) {
            localStorage.clear();
            location.reload();
        }
    };

    setInterval(updateClock, 1000);
    updateClock();
    renderRoutine();
    renderCourses();
    updatePomoDisplay();
</script>

</body>
</html>
